# Offline job-embedding backfill in the cloud (free, unlimited minutes on a
# public repo). This warms jobs.embedding so live searches never wait on the
# embedding rate limit. Same premium Gemini model as the app — just off the
# hot path. The script is idempotent (only touches embedding IS NULL rows), so
# each run resumes where the last left off and also embeds newly-harvested jobs.
#
# It also carries the project's scheduled housekeeping, which piggy-backs here
# rather than on a second schedule: this workflow already runs 4x a day against
# the same database, and it exists partly to keep the Supabase project from
# auto-pausing after 7 days idle. Today that is the 30-day archived-conversation
# sweep (Phase C), the llm_cache prune and the usage-counter sweep (Phase D).
#
# Trigger: "Run workflow" (workflow_dispatch) to start now, plus a schedule that
# resumes/maintains automatically. Each run is bounded to ~5h20m so it stays
# under GitHub's 6-hour job cap; the next run finishes any remainder.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL     (Supabase transaction-pooler URI)
#   COHERE_API_KEY   (embeddings provider — dashboard.cohere.com trial key)

name: embed-jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours: finish the backfill, then keep new jobs warm

concurrency:
  group: embed-jobs
  cancel-in-progress: false # never run two backfills at once — they share the quota

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Deliberately BEFORE the embed step, not after. The embed step runs for
      # up to EMBED_BUDGET_MIN and the job's own timeout-minutes sits just above
      # it, so anything queued behind it is the first thing cancelled on a slow
      # run. This is a single DELETE over a small table — seconds — and putting
      # it first means it cannot be starved by the backfill.
      #
      # Hard-deletes conversations archived by "new chat" more than 30 days ago;
      # their messages cascade. See scripts/sweep-conversations.ts.
      - name: Sweep archived conversations (30 days)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run sweep:conversations:ci
      # Also before the embed step, and for the same reason. Deletes llm_cache
      # rows past their task's own TTL — 6h for rerank scores, 90d for resume
      # extraction — which nothing did until Phase D, so the table grew forever
      # against a 500 MB database. See scripts/sweep-llm-cache.ts.
      - name: Sweep stale llm_cache rows (per-task TTL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run sweep:llm-cache:ci
      # Quota counters for days nobody reads any more. 90-day retention, so the
      # real usage record survives long enough to size the next round of limits.
      - name: Sweep old usage counters (90 days)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run sweep:usage-counters:ci
      - name: Embed jobs (Cohere, conservatively paced)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # Cohere docs claim 2,000 inputs/min for a trial key, but this key's
          # real observed throughput is far below that. Run conservatively and
          # let the script's retry-with-wait loop absorb 429s — fully unattended,
          # no manual re-trigger ever needed; the 6-hourly schedule + idempotent
          # resume finishes the corpus over however many runs it takes.
          EMBED_BATCH: "48"
          EMBED_PAUSE: "15"
          EMBED_BUDGET_MIN: "320"
        run: npm run embed-jobs:ci
